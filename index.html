<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Protein Tracker</title>
  <meta name="description" content="Quickly track daily protein intake with a calendar-first interface.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Protein">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
  <link rel="icon" type="image/png" href="assets/icon-192.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=21">
  <script>
    try {
      var a = localStorage.getItem('appearance');
      var dark = a !== 'light' && (a !== 'system' || !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  </script>
</head>
<body>
  <main id="app" class="app"></main>
  <div id="modals"></div>
  <script src="nutrition.js?v=21"></script>
  <script src="app.js?v=21"></script>
</body>
</html>
